function mobile(t){return `<div class=mobile><span class=mark>♨</span><b>${t}</b><span>☰</span></div>`}function thumb(p){return `<div class=thumb><div class=photo style="background-image:url('${p.hero}')"></div><div class=mini><span class=miniavatar style="background:${p.accent}">J</span><b>${esc(p.name)}</b><small>${esc(p.desc)}</small><em style="background:${p.accent}">${esc(p.cta)}</em></div></div>`}
function dashboard(){let visits=pages.reduce((a,p)=>a+p.visits,0),clicks=pages.reduce((a,p)=>a+p.clicks,0);root.innerHTML=`<div class=app>${side()}<main class=main>${mobile('เซลเพจของฉัน')}<header class=head><div><p class=eyebrow>วันจันทร์ที่ 26 ตุลาคม 2026</p><h1>สวัสดี, คุณเจ <span style=color:var(--coral)>✦</span></h1><p>พร้อมเปลี่ยนทุกคลิกให้เป็นยอดขายหรือยัง?</p></div><div class=actions><label class=search>⌕ <input placeholder="ค้นหาเซลเพจ..."></label><button class=btn onclick="edit('new')">+ สร้างเซลเพจใหม่</button></div></header><section class=stats><div class=stat><i>+2 เดือนนี้</i><small>↗ เซลเพจทั้งหมด</small><strong>${String(pages.length).padStart(2,'0')}</strong><small>เซลเพจที่สร้างไว้</small></div><div class=stat><i>+18.4%</i><small>◉ เข้าชมทั้งหมด</small><strong>${(visits/1000).toFixed(1)}k</strong><small>คนเข้าชมหน้า</small></div><div class=stat><i>+2.1%</i><small>♧ อัตราคลิกเฉลี่ย</small><strong>${(clicks/visits*100).toFixed(1)}%</strong><small>จากทุกหน้า</small></div><div class=stat><i>+24.8%</i><small>▥ ยอดขายจากหน้า</small><strong>฿48.6k</strong><small>เดือนนี้</small></div></section><section class=section><div class=sectionhead><div><h2>เซลเพจล่าสุด</h2><p>จัดการหน้าแคมเปญทั้งหมดของคุณในที่เดียว</p></div><button>ดูทั้งหมด ↗</button></div><div class=rows>${pages.map(p=>`<div class=row>${thumb(p)}<div class=info><h3>${esc(p.name)} <span class="badge ${p.status==='draft'?'draft':''}">● ${p.status==='published'?'เผยแพร่แล้ว':'ฉบับร่าง'}</span></h3><p>${esc(p.note)}</p><div class=meta>◎ lnwsalepagetiktok.com/${esc(p.slug)}　 แก้ไขเมื่อสักครู่</div></div><div class=metrics><div><b>${p.visits.toLocaleString()}</b><small>เข้าชม</small></div><div><b>${(p.clicks/p.visits*100).toFixed(1)}%</b><small>CTR</small></div></div><div class=rowactions><button onclick="publicPage('${p.slug}')">◉</button><button onclick="edit('${p.id}')">✎</button><button onclick="removePage('${p.id}')">⌫</button></div></div>`).join('')}<button class=create onclick="edit('new')"><span>+</span><div><b>สร้างเซลเพจใหม่</b><small>เริ่มจากเทมเพลตที่พร้อมขาย</small></div>›</button></div></section><section class=bottom><div class=box><small style=color:var(--coral);font-weight:800;letter-spacing:1px>INSIGHT</small><h2>ทราฟฟิกของคุณกำลังไปได้ดี</h2><p>เมื่อเทียบกับสัปดาห์ก่อน เซลเพจเซรั่มหน้าใสมีคนเข้าชมมากที่สุด</p><div class=bar><svg viewBox="0 0 600 130" preserveAspectRatio="none"><path d="M0 110 C65 101 74 78 123 88 S185 103 222 68 S287 82 323 58 S370 74 405 47 S476 72 512 33 S560 38 600 10 V130 H0Z" fill="#ff6b4a" opacity=.13/><path d="M0 110 C65 101 74 78 123 88 S185 103 222 68 S287 82 323 58 S370 74 405 47 S476 72 512 33 S560 38 600 10" fill=none stroke="#ff6b4a" stroke-width=4 stroke-linecap=round/></svg></div></div><div class="box quick"><small style=color:var(--coral);font-weight:800;letter-spacing:1px>QUICK START</small><h2>ไปต่อกับ lnw</h2><div><b>01　เพิ่ม TikTok Pixel</b><small>วัดผลแคมเปญได้แม่นขึ้น</small></div><div><b>02　เชื่อมต่อโดเมน</b><small>ใช้ลิงก์แบรนด์ของคุณเอง</small></div><div><b>03　ลอง AI SalePage</b><small>ให้ AI ช่วยเขียนหน้าให้</small></div></div></section></main></div>`}
function editor(id){let p=pages.find(x=>x.id===id)||{id:'new-'+Date.now(),name:'',slug:'',note:'',desc:'',status:'draft',accent:'#ff6b4a',hero:'https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1200&q=85',cta:'',url:'',visits:0,clicks:0,buttons:[['','','']]};let savep=()=>{p.name=$('#name').value;p.slug=$('#slug').value||p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-');p.note=$('#note').value;p.desc=$('#desc').value;p.cta=$('#cta').value;p.url=$('#url').value;p.hero=$('#hero').value;p.accent=$('#accent').value;p.buttons=[...document.querySelectorAll('.link')].map(x=>[x.querySelector('.lt').value,x.querySelector('.ld').value,x.querySelector('.lu').value]);if(!pages.find(x=>x.id===p.id))pages.unshift(p);save();dashboard()};root.innerHTML=`<div class=app>${side()}<main class=main>${mobile(id==='new'?'สร้างเซลเพจใหม่':'แก้ไขเซลเพจ')}<div class=editor><div class=editbar><button class=back onclick=dashboard()>← กลับไปเซลเพจของฉัน</button><div class=editactions><button class="btn alt" onclick="publicPage('${p.slug||'skin-glow'}')">◉ พรีวิว</button><button class=btn onclick=savep()>✓ เผยแพร่หน้า</button></div></div><div class=editorhead><div><small class=kicker>SALE PAGE BUILDER</small><h1>${id==='new'?'เปิดหน้าใหม่ให้พร้อมขาย':'ปรับหน้าให้คม แล้วกดเผยแพร่'}</h1><p>ทุกการแก้ไขจะสะท้อนในพรีวิวด้านขวาทันที</p></div><small style=color:#9ba4b0>01 เนื้อหา　›　02 ดีไซน์　›　03 เผยแพร่</small></div><div class=layout><section><div class=tabs><button class=active>▦ เนื้อหา</button><button>✦ รูปลักษณ์</button></div><div class=card><div class=cardhead><small class=kicker>01 · ข้อมูลหลัก</small><h2>บอกให้คนรู้ว่าหน้านี้คืออะไร</h2></div><div class=field><label>ชื่อหน้า / ชื่อร้าน</label><input id=name value="${esc(p.name)}" placeholder="เช่น ร้านของฉัน"></div><div class=field><label>คำอธิบายสั้น</label><textarea id=desc rows=3 placeholder="บอกจุดเด่นในหนึ่งประโยค">${esc(p.desc)}</textarea></div><div class=cols><div class=field><label>ลิงก์หน้า (slug)</label><div class=prefix><span>lnwsalepagetiktok.com/</span><input id=slug value="${esc(p.slug)}"></div></div><div class=field><label>โน้ตส่วนตัว</label><input id=note value="${esc(p.note)}" placeholder="เช่น แคมเปญ TikTok"></div></div></div><div class=card><div class=cardhead><small class=kicker>02 · ปุ่มหลัก</small><h2>พาคนไปสู่การซื้อ</h2></div><div class=cols><div class=field><label>ข้อความบนปุ่ม</label><input id=cta value="${esc(p.cta)}"></div><div class=field><label>ลิงก์ปลายทาง</label><input id=url value="${esc(p.url)}"></div></div><div class=field><label>Conversion event</label><select><option>นับคลิกปกติ</option><option>ซื้อสำเร็จ (Purchase)</option><option>กรอกข้อมูลลูกค้า (Lead)</option></select></div></div><div class=card><div class=cardhead><small class=kicker>03 · ปุ่มลิงก์</small><h2>รวมทุกช่องทางไว้ในหน้าเดียว</h2></div><div id=links>${p.buttons.map((b,i)=>`<div class=link><div class=linktop><input class=lt value="${esc(b[0])}" placeholder="ชื่อปุ่ม เช่น สั่งซื้อสินค้า"><button onclick="this.closest('.link').remove()">⌫</button></div><div class=cols><input class=lu value="${esc(b[2])}" placeholder="https://..."><select><option>นับคลิกปกติ</option><option>ซื้อสำเร็จ (Purchase)</option><option>Lead</option></select></div><input class=ld value="${esc(b[1])}" placeholder="รายละเอียดสั้น ๆ"></div>`).join('')}</div><button class="btn alt" style="margin-top:10px" onclick="addLink()">+ เพิ่มปุ่ม</button></div></section><aside class=preview><div class=previewbar><span>● Live preview</span><span>Mobile　↗</span></div><div class=phone><div class=notch></div><div class=public><div class=hero style="background-image:url('${p.hero}')"></div><div class=publicbody><div class=pavatar style="background:${p.accent}">J</div><h3>${esc(p.name||'ชื่อเซลเพจของคุณ')}</h3><p>${esc(p.desc||'คำอธิบายสั้น ๆ ของเซลเพจ')}</p><a class=pcta style="background:${p.accent}" href="${p.url||'#'}">${esc(p.cta||'ปุ่มหลักของคุณ')}</a>${p.buttons.map(b=>`<a class=plink href="${b[2]||'#'}"><b>${esc(b[0]||'ชื่อปุ่ม')}</b><small>${esc(b[1])}</small></a>`).join('')}</div></div></div><div class=url>◎ lnwsalepagetiktok.com/${esc(p.slug||'your-slug')}</div></aside></div></div></main></div>`}
function addLink(){let d=document.createElement('div');d.className='link';d.innerHTML='<div class=linktop><input class=lt placeholder="ชื่อปุ่ม เช่น สั่งซื้อสินค้า"><button onclick="this.closest(\'.link\').remove()">⌫</button></div><div class=cols><input class=lu placeholder="https://..."><select><option>นับคลิกปกติ</option><option>ซื้อสำเร็จ (Purchase)</option><option>Lead</option></select></div><input class=ld placeholder="รายละเอียดสั้น ๆ">';$('#links').appendChild(d)}function removePage(id){if(confirm('ลบเซลเพจนี้ใช่ไหม?')){pages=pages.filter(p=>p.id!==id);save();dashboard()}}function edit(id){location.hash='editor/'+id;editor(id)}function publicPage(slug){location.hash='p/'+slug;let p=pages.find(x=>x.slug===slug)||pages[0];root.innerHTML=`<div class=publicwrap><div class=publicnav><a href="#" onclick="dashboard()"><span class=mark style=display:inline-grid;margin-right:7px>♨</span><b>lnwsalepagetiktok</b></a><a href="#" onclick="dashboard()">สร้างของคุณ ↗</a></div><main class=publiccard><div class=cover style="background-image:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45)),url('${p.hero}')"><span>♨ lnwsalepagetiktok</span><span>● Live</span></div><section class=profile><div class=bigavatar style="background:${p.accent}">J</div><h1>${esc(p.name)}</h1><p>${esc(p.desc)}</p><a class=bigcta style="background:${p.accent}" href="${p.url||'#'}">${esc(p.cta)} ↗</a>${p.buttons.map((b,i)=>`<a class="biglink ${i===0?'dark':''}" href="${b[2]||'#'}"><span><b>${esc(b[0])}</b><small>${esc(b[1])}</small></span>›</a>`).join('')}</section></main><div class=publicfoot><span>© 2026 ${esc(p.name)}</span><span>สร้างด้วย <b>lnwsalepagetiktok</b></span></div></div>`}function route(){let h=location.hash.slice(1);if(h.startsWith('editor/'))editor(h.slice(7));else if(h.startsWith('p/'))publicPage(h.slice(2));else dashboard()}window.addEventListener('hashchange',route);route();
</script></body></html>
